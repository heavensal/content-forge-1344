service: contentforge_1344

image: adam1344/contentforge_1344

deploy_timeout: 120

servers:
  web:
    - 51.75.124.208

proxy:
  ssl: true
  host: contentforge.1344.fr

registry:
  username: adam1344
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

env:
  clear:
    MCP_ENABLED: "true"
    MCP_RESOURCE_URL: https://contentforge.1344.fr/mcp
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - SMTP_ADDRESS
    - SMTP_PORT
    - SMTP_USER_NAME
    - SMTP_PASSWORD
    # Kamal injects only names listed here. Include these when .kamal/secrets
    # defines them so a configured value reaches the container, and omit them
    # when absent so deploy still succeeds.
    <%-
      require "dotenv"
      optional_secrets = File.file?(".kamal/secrets") ? Dotenv.parse(".kamal/secrets") : {}
    -%>
    <%- %w[MAILER_FROM CORS_ALLOWED_ORIGINS].each do |key| -%>
    <%- if optional_secrets[key].to_s.strip != "" -%>
    - <%= key %>
    <%- end -%>
    <%- end -%>

ssh:
  user: ubuntu
