# Deploy to production (Kamal → VPS) on every push to main.
#
# Required GitHub repository secrets:
#   SSH_PRIVATE_KEY          — private key for ssh ubuntu@51.75.124.208 (no passphrase, or use ssh-agent with passphrase secret)
#   KAMAL_REGISTRY_PASSWORD  — Docker Hub access token (push/pull adam1344/forge)
#   RAILS_MASTER_KEY         — same as config/master.key (32-char hex)
#   DATABASE_URL             — production PostgreSQL URL (e.g. Neon), same as local .kamal/secrets
#   SMTP_ADDRESS             — SMTP server address (mail.1344.fr)
#   SMTP_PORT                — SMTP port (465)
#   SMTP_USER_NAME           — SMTP account username
#   SMTP_PASSWORD            — SMTP account password
# Optional GitHub secrets: MAILER_FROM, CORS_ALLOWED_ORIGINS
#
name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: kamal-deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          host_key_file="$RUNNER_TEMP/forge-vps-host-key"
          ssh-keyscan -T 15 -t ed25519 51.75.124.208 > "$host_key_file"
          fingerprint=$(ssh-keygen -lf "$host_key_file" -E sha256 | awk '{print $2}')
          # Verified against /etc/ssh/ssh_host_ed25519_key.pub on the VPS.
          if [ "$fingerprint" != "SHA256:YNbe7lJuDnMdWUJ52gOnWjxIPBdEqcpTpKAujAzkG50" ]; then
            echo "Unexpected VPS host key fingerprint: $fingerprint" >&2
            exit 1
          fi
          touch ~/.ssh/known_hosts
          if ssh-keygen -F 51.75.124.208 -f ~/.ssh/known_hosts >/dev/null; then
            ssh-keygen -R 51.75.124.208 -f ~/.ssh/known_hosts >/dev/null
          fi
          cat "$host_key_file" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH before building the image
        run: |
          bundle exec ruby -rnet/ssh -e 'Net::SSH.start("51.75.124.208", "ubuntu", verify_host_key: :always, non_interactive: true, timeout: 15) { |ssh| ssh.exec!("true") }'

      - name: Write Kamal secrets
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_ADDRESS: ${{ secrets.SMTP_ADDRESS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER_NAME: ${{ secrets.SMTP_USER_NAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAILER_FROM: ${{ secrets.MAILER_FROM }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
        run: |
          mkdir -p .kamal
          ruby -e '
            required = %w[KAMAL_REGISTRY_PASSWORD RAILS_MASTER_KEY DATABASE_URL SMTP_ADDRESS SMTP_PORT SMTP_USER_NAME SMTP_PASSWORD]
            lines = required.map do |k|
              v = ENV[k]
              abort("Missing required GitHub Actions secret: #{k}") if v.nil? || v.strip.empty?
              %(#{k}=#{v.gsub("\n", "")})
            end
            %w[MAILER_FROM CORS_ALLOWED_ORIGINS].each do |k|
              v = ENV[k]
              next if v.nil? || v.strip.empty?
              lines << %(#{k}=#{v.gsub("\n", "")})
            end
            File.write(".kamal/secrets", lines.join("\n") + "\n")
          '

      - name: Kamal deploy
        env:
          DOCKER_BUILDKIT: 1
        run: bin/kamal deploy
